<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Budget Tracker (Cloud Synced)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-violet: #8b5cf6;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --input-bg: #0f172a;
      --input-border: #475569;
      --disabled-bg: #111827;
      --disabled-border: #1f2937;
      --disabled-text: #4b5563;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      min-width: 1024px;
    }

    .container {
      width: 900px;
      max-width: 900px;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1 { 
      margin-top: 0; 
      margin-bottom: 4px;
      font-size: 1.8rem; 
      text-align: center;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .developer-label {
      text-align: center;
      margin-bottom: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .field-group { margin-bottom: 16px; }

    label { 
      display: block; 
      font-weight: 600; 
      margin-bottom: 6px; 
      font-size: 0.9rem; 
      color: var(--accent-cyan);
    }

    .fixed-label { color: #a78bfa; }
    .earning-label { color: var(--accent-amber); }
    
    input {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.3);
    }

    input:disabled {
      background-color: var(--disabled-bg);
      color: var(--disabled-text);
      border-color: var(--disabled-border);
      cursor: not-allowed;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .section-title {
      font-weight: 700;
      font-size: 1rem;
      margin-top: 28px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 6px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 16px;
      background: var(--accent-violet);
      border-radius: 4px;
    }

    .chart-header {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      text-transform: uppercase;
    }

    .chart-header.expenses-header { color: var(--accent-cyan); }
    .chart-header.earnings-header { color: var(--accent-amber); }

    .chart-container {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--card-border);
      border-radius: 0 0 8px 8px;
      background: #0f172a;
    }

    .daily-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid #1e293b;
      align-items: center;
      background: #111827;
    }

    .daily-row:nth-child(even) { background: #0f172a; }
    .daily-row.weekend { background: #1e1b4b; }
    .daily-row.locked { background: #090d16; }

    .daily-row.today-highlight {
      background: rgba(6, 182, 212, 0.1);
      border-left: 3px solid var(--accent-cyan);
    }

    .date-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .date-label.locked-text { color: var(--disabled-text); }
    .lock-icon { font-size: 0.75rem; opacity: 0.6; }
    .daily-row input { padding: 6px 8px; font-size: 0.9rem; }

    .chart-column-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chart-column-title.earning { color: var(--accent-amber); }
    .chart-column-title.expense { color: var(--accent-cyan); }

    .analytics-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
    }

    .analytics-chart-wrapper {
      position: relative;
      height: 280px;
      width: 100%;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 24px;
      margin-bottom: 20px;
    }

    .summary-card {
      padding: 16px;
      border-radius: 12px;
      box-sizing: border-box;
      border: 1px solid transparent;
    }

    .summary-card.expense {
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.3);
    }

    .summary-card.savings {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .summary-card p { margin: 0; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .summary-card h2 { margin: 6px 0 0 0; font-size: 1.5rem; font-weight: 700; }
    .summary-card.expense h2 { color: var(--accent-rose); }
    .summary-card.savings h2 { color: var(--accent-emerald); }

    .btn-clear {
      width: 100%;
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.4);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-clear:hover { background: rgba(244, 63, 94, 0.3); }
  </style>
</head>
<body>

<div class="container">
  <h1>Monthly Budget Tracker</h1>
  <div class="developer-label">Developer: Abu Talha Mondal</div>

  <div class="field-group">
    <label for="monthSelect">Select Month</label>
    <input type="month" id="monthSelect">
  </div>

  <div class="grid-2 field-group">
    <div>
      <label for="salary">Base Salary (₹)</label>
      <input type="number" id="salary" min="0" placeholder="e.g. 50000">
    </div>
    <div>
      <label for="totalExtraEarnings" class="earning-label">Total Extra Earning (₹)</label>
      <input type="text" id="totalExtraEarnings" readonly value="₹0" style="font-weight: 700; color: var(--accent-amber);">
    </div>
  </div>

  <div class="section-title">Fixed Expenses</div>
  <div class="grid-2 field-group">
    <div>
      <label for="roomRent" class="fixed-label">Room Rent (₹)</label>
      <input type="number" id="roomRent" min="0" placeholder="0">
    </div>
    <div>
      <label for="food" class="fixed-label">Food (₹)</label>
      <input type="number" id="food" min="0" placeholder="0">
    </div>
  </div>

  <div class="section-title">Daily Activity Charts</div>
  <div class="grid-2">
    <div>
      <div class="chart-column-title earning">▲ Extra Earnings</div>
      <div class="chart-header earnings-header">
        <span>Date</span>
        <span>Amount (₹)</span>
      </div>
      <div class="chart-container" id="earningChartContainer"></div>
    </div>
    <div>
      <div class="chart-column-title expense">▼ Extra Expenses</div>
      <div class="chart-header expenses-header">
        <span>Date</span>
        <span>Amount (₹)</span>
      </div>
      <div class="chart-container" id="expenseChartContainer"></div>
    </div>
  </div>

  <div class="dashboard">
    <div class="summary-card expense">
      <p>Total Expenses</p>
      <h2 id="totalExpense">₹0</h2>
    </div>
    <div class="summary-card savings">
      <p>Net Savings</p>
      <h2 id="totalSavings">₹0</h2>
    </div>
  </div>

  <div class="section-title">Monthly Comparison Analytics</div>
  <div class="analytics-box">
    <div class="analytics-chart-wrapper">
      <canvas id="monthlyComparisonChart"></canvas>
    </div>
  </div>

  <div id="authPanel" style="margin-top:24px;padding:16px;border:1px solid var(--card-border);border-radius:12px;background:#0f172a;">
    <div class="section-title" style="margin-top:0;">Cloud Account</div>
    <div class="grid-2">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button type="button" id="signInBtn" style="flex:1;padding:10px;border:0;border-radius:8px;cursor:pointer;">Sign In</button>
      <button type="button" id="signUpBtn" style="flex:1;padding:10px;border:0;border-radius:8px;cursor:pointer;">Create Account</button>
      <button type="button" id="signOutBtn" style="flex:1;padding:10px;border:0;border-radius:8px;cursor:pointer;display:none;">Sign Out</button>
    </div>
    <div id="authStatus" style="margin-top:10px;color:var(--text-muted);font-size:.85rem;">Not signed in</div>
  </div>

  <button type="button" class="btn-clear" id="clearBtn" style="margin-top: 24px;">Clear This Month's Data</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import firebaseConfig from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const monthSelect = document.getElementById('monthSelect');
  const salaryInput = document.getElementById('salary');
  const totalExtraEarningsInput = document.getElementById('totalExtraEarnings');
  const roomRentInput = document.getElementById('roomRent');
  const foodInput = document.getElementById('food');
  const earningChartContainer = document.getElementById('earningChartContainer');
  const expenseChartContainer = document.getElementById('expenseChartContainer');
  const totalExpenseEl = document.getElementById('totalExpense');
  const totalSavingsEl = document.getElementById('totalSavings');
  const clearBtn = document.getElementById('clearBtn');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const signInBtn = document.getElementById('signInBtn');
  const signUpBtn = document.getElementById('signUpBtn');
  const signOutBtn = document.getElementById('signOutBtn');
  const authStatus = document.getElementById('authStatus');

  let comparisonChartInstance = null;
  let unsubscribeListener = null;
  let currentUser = null;
  const today = new Date();
  monthSelect.value = today.toISOString().slice(0, 7);

  function userDocRef(month) { return doc(db, 'users', currentUser.uid, 'budget_data', month); }
  function isNotToday(year, month, day) {
    const checkDate = new Date(year, month - 1, day);
    const currentDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    return checkDate.getTime() !== currentDate.getTime();
  }

  function buildDailyChart(container, inputClass, savedData = {}) {
    container.innerHTML = '';
    const [year, month] = monthSelect.value.split('-').map(Number);
    const totalDays = new Date(year, month, 0).getDate();
    for (let day = 1; day <= totalDays; day++) {
      const dateObj = new Date(year, month - 1, day);
      const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
      const formattedDate = `${String(day).padStart(2, '0')} ${dayName}`;
      const isWeekend = dateObj.getDay() === 0 || dateObj.getDay() === 6;
      const locked = isNotToday(year, month, day);
      const row = document.createElement('div');
      row.className = `daily-row ${isWeekend ? 'weekend' : ''} ${locked ? 'locked' : 'today-highlight'}`;
      const savedAmount = savedData[day] || '';
      row.innerHTML = `<span class="date-label ${locked ? 'locked-text' : ''}">${formattedDate} ${locked ? '<span class="lock-icon">🔒</span>' : ''}</span><input type="number" class="${inputClass}" data-day="${day}" min="0" placeholder="₹ 0" value="${savedAmount}" ${locked ? 'disabled' : ''}>`;
      container.appendChild(row);
    }
    container.querySelectorAll(`.${inputClass}:not([disabled])`).forEach(input => input.addEventListener('input', saveData));
  }

  function updateTotal() {
    const salary = parseFloat(salaryInput.value) || 0;
    const rent = parseFloat(roomRentInput.value) || 0;
    const food = parseFloat(foodInput.value) || 0;
    let extraEarningsTotal = 0, extraExpensesTotal = 0;
    document.querySelectorAll('.daily-earning-amount').forEach(i => extraEarningsTotal += parseFloat(i.value) || 0);
    document.querySelectorAll('.daily-expense-amount').forEach(i => extraExpensesTotal += parseFloat(i.value) || 0);
    const totalIncome = salary + extraEarningsTotal;
    const grandTotalExpenses = rent + food + extraExpensesTotal;
    const netSavings = totalIncome - grandTotalExpenses;
    totalExtraEarningsInput.value = `₹${extraEarningsTotal.toLocaleString('en-IN')}`;
    totalExpenseEl.textContent = `₹${grandTotalExpenses.toLocaleString('en-IN')}`;
    totalSavingsEl.textContent = `₹${netSavings.toLocaleString('en-IN')}`;
    totalSavingsEl.style.color = netSavings < 0 ? 'var(--accent-rose)' : 'var(--accent-emerald)';
  }

  async function saveData() {
    if (!currentUser || !monthSelect.value) return;
    const extraEarningsData = {}, extraExpensesData = {};
    document.querySelectorAll('.daily-earning-amount').forEach(i => { if (i.value) extraEarningsData[i.dataset.day] = i.value; });
    document.querySelectorAll('.daily-expense-amount').forEach(i => { if (i.value) extraExpensesData[i.dataset.day] = i.value; });
    await setDoc(userDocRef(monthSelect.value), { salary: salaryInput.value, roomRent: roomRentInput.value, food: foodInput.value, extraEarningsData, extraExpensesData });
    updateTotal();
    renderComparisonChart();
  }

  function listenToMonthData() {
    if (unsubscribeListener) unsubscribeListener();
    if (!currentUser) return;
    unsubscribeListener = onSnapshot(userDocRef(monthSelect.value), snap => {
      const data = snap.exists() ? snap.data() : {};
      salaryInput.value = data.salary || ''; roomRentInput.value = data.roomRent || ''; foodInput.value = data.food || '';
      buildDailyChart(earningChartContainer, 'daily-earning-amount', data.extraEarningsData || {});
      buildDailyChart(expenseChartContainer, 'daily-expense-amount', data.extraExpensesData || {});
      updateTotal(); renderComparisonChart();
    });
  }

  async function renderComparisonChart() {
    if (!currentUser) return;
    const querySnapshot = await getDocs(collection(db, 'users', currentUser.uid, 'budget_data'));
    const monthsData = [];
    querySnapshot.forEach(s => {
      const p = s.data(), salary = parseFloat(p.salary) || 0, rent = parseFloat(p.roomRent) || 0, food = parseFloat(p.food) || 0;
      const extraEarnings = Object.values(p.extraEarningsData || {}).reduce((a,v) => a + (parseFloat(v)||0), 0);
      const extraExpenses = Object.values(p.extraExpensesData || {}).reduce((a,v) => a + (parseFloat(v)||0), 0);
      monthsData.push({ monthKey:s.id, totalEarnings:salary+extraEarnings, totalExpenses:rent+food+extraExpenses });
    });
    monthsData.sort((a,b) => a.monthKey.localeCompare(b.monthKey));
    const labels = monthsData.map(x => { const [y,m]=x.monthKey.split('-'); return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'short',year:'2-digit'}); });
    const ctx = document.getElementById('monthlyComparisonChart').getContext('2d');
    if (comparisonChartInstance) comparisonChartInstance.destroy();
    comparisonChartInstance = new Chart(ctx, { type:'bar', data:{labels, datasets:[{label:'Total Earnings (₹)',data:monthsData.map(x=>x.totalEarnings),backgroundColor:'#f59e0b',borderRadius:6},{label:'Total Expenses (₹)',data:monthsData.map(x=>x.totalExpenses),backgroundColor:'#f43f5e',borderRadius:6}]}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#f8fafc',font:{family:'system-ui'}}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ₹${c.raw.toLocaleString('en-IN')}`}}},scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'#334155'}},y:{ticks:{color:'#94a3b8'},grid:{color:'#334155'}}}} });
  }

  async function authenticate(action) {
    const email=emailInput.value.trim(), password=passwordInput.value;
    if (!email || password.length < 6) return alert('Enter a valid email and a password of at least 6 characters.');
    try { if(action==='signup') await createUserWithEmailAndPassword(auth,email,password); else await signInWithEmailAndPassword(auth,email,password); }
    catch(e) { alert(e.message); }
  }
  signInBtn.onclick=()=>authenticate('signin');
  signUpBtn.onclick=()=>authenticate('signup');
  signOutBtn.onclick=()=>signOut(auth);
  salaryInput.addEventListener('input', saveData); roomRentInput.addEventListener('input', saveData); foodInput.addEventListener('input', saveData);
  monthSelect.addEventListener('change', listenToMonthData);
  clearBtn.addEventListener('click', async()=>{ if(!currentUser) return alert('Please sign in first.'); if(confirm(`Are you sure you want to clear all entries for ${monthSelect.value}?`)){ await deleteDoc(userDocRef(monthSelect.value)); listenToMonthData(); }});

  onAuthStateChanged(auth, user => {
    currentUser = user;
    if (user) { authStatus.textContent=`Signed in as ${user.email}`; signInBtn.style.display='none'; signUpBtn.style.display='none'; signOutBtn.style.display='block'; listenToMonthData(); }
    else { authStatus.textContent='Not signed in — your cloud data is protected per account.'; signInBtn.style.display='block'; signUpBtn.style.display='block'; signOutBtn.style.display='none'; if(unsubscribeListener) unsubscribeListener(); }
  });
</script>

</body>
</html>
